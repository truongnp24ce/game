name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Mobile-Device-Programming-Animal-Villa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimalVilla-debug-apk
          path: Mobile-Device-Programming-Animal-Villa/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Rename APK for release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk "release/AnimalVilla-debug-build-${{ github.run_number }}.apk"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AnimalVilla Debug Build ${{ github.run_number }}
          body: |
            Debug APK tự động build từ commit ${{ github.sha }}.

            Tải file `.apk` ở mục Assets bên dưới và cài đặt trên thiết bị Android.
          files: Mobile-Device-Programming-Animal-Villa/release/*.apk
